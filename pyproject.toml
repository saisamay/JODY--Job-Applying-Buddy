[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "apps/api"
files = ["apps/api/jody", "apps/worker", "apps/api/migrations"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
addopts = "-q"
