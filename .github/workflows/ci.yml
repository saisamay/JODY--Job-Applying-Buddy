name: Foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.lock
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          npm ci --no-fund --no-audit
      - name: Start local data services
        run: |
          python infra/init-env.py
          docker compose --env-file .env -f infra/compose.yaml up -d --wait
      - name: Check Python and run integration tests
        run: |
          if ! test -x /usr/lib/postgresql/16/bin/pg_restore; then
            sudo apt-get update -qq && sudo apt-get install -y postgresql-client-16
          fi
          set -a; source .env; set +a
          ruff check apps/api apps/worker tests infra
          ruff format --check apps/api apps/worker tests infra
          mypy
          pytest
      - name: Verify API contracts and frontend
        run: |
          npm run contracts
          git diff --exit-code -- packages/shared/api.d.ts
          npm run lint
          npm run typecheck
          npm run format:check
          npm run build
      - name: Browser round trip
        run: |
          npx playwright install --with-deps chromium
          JODY_WEB_MODE=start ./infra/run-local.sh > "$RUNNER_TEMP/jody-stack.log" 2>&1 &
          stack_pid=$!
          trap 'kill "$stack_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/ -o /dev/null
          set -a; source .env; set +a
          npm run test:browser
      - name: Verify preview Docker startup and restricted session
        run: |
          set -euo pipefail
          set -a; source .env; set +a
          export DATABASE_URL="postgresql://jody:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/jody"
          export REDIS_URL="redis://127.0.0.1:${REDIS_PORT}/0"
          docker build -f apps/api/Dockerfile -t jody-preview-ci .
          docker run -d --name jody-preview-ci --network host -e PORT=8012 -e DATABASE_URL -e REDIS_URL -e JODY_DB_APP_PASSWORD -e JODY_ENCRYPTION_KEY -e JODY_OWNER_KEY jody-preview-ci
          API_BASE_URL=http://127.0.0.1:8012 npm exec -w apps/web -- next start --hostname 127.0.0.1 --port 3012 > "$RUNNER_TEMP/jody-preview-web.log" 2>&1 &
          web_pid=$!
          trap 'docker logs --tail 15 jody-preview-ci; docker rm -f jody-preview-ci >/dev/null; kill "$web_pid" || true' EXIT
          curl -fsS --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:8012/health/ready
          curl -fsS --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:3012/ -o /dev/null
          WEB_BASE_URL=http://127.0.0.1:3012 API_BASE_URL=http://127.0.0.1:8012 node tests/preview.mjs
      - name: Show service startup diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file .env -f infra/compose.yaml ps
          if test -f "$RUNNER_TEMP/jody-stack.log"; then tail -60 "$RUNNER_TEMP/jody-stack.log"; fi
